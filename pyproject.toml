[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "redcap-api-mcp"
version = "0.1.0"
description = "Privacy-first, read-only REDCap API MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "REDCap API MCP contributors"}]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]
dependencies = ["httpx>=0.27,<1", "keyring>=25,<26", "mcp>=1.12,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
redcap-mcp = "redcap_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/redcap_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Compact CLI argument declarations are intentionally kept on single lines.
ignore = ["E701", "E702"]
